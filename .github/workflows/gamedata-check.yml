# Vérifie chaque jour si tycoon-tools a changé (patch du jeu).
# En cas d'écart : régénère site/data.js et ouvre une Pull Request à relire.
# Le job « signals » surveille en plus des sources communautaires indépendantes
# (wikis, guide) et ouvre une issue quand elles bougent — alerte précoce, sans
# toucher aux données.
# Lancement manuel possible : onglet Actions → Check game data → Run workflow.
name: Check game data

on:
  schedule:
    - cron: '30 7 * * *'   # tous les jours, 07:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect game data drift
        id: drift
        run: |
          if python3 tools/update-gamedata.py --check; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate data.js
        if: steps.drift.outputs.drift == 'true'
        run: python3 tools/update-gamedata.py

      - name: Set up Node.js
        if: steps.drift.outputs.drift == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Regenerate SEO content pages and sitemap
        if: steps.drift.outputs.drift == 'true'
        run: node tools/generate-seo-pages.js

      - name: Run tracker tests against the new data
        if: steps.drift.outputs.drift == 'true'
        working-directory: tests
        run: |
          npm install --no-fund --no-audit
          node test-droidex.js

      - name: Open a pull request
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/gamedata-update
          title: 'Game data update detected on tycoon-tools'
          commit-message: 'Update game data from tycoon-tools'
          add-paths: |
            site/data.js
            site/value-list
            site/rebirth-requirements
            site/faq
            site/sitemap.xml
          body: |
            The scheduled check found that [tycoon-tools](https://tycoon-tools.com/droid-tycoon/) no longer matches `site/data.js` — the game was probably patched.

            `site/data.js` has been regenerated, the SEO content pages and sitemap were rebuilt from the new data, and the tracker test suite passed against it.

            **Before merging:**
            - [ ] Review the diff (rebalanced requirements? new incomes? new droid?)
            - [ ] SEO pages regenerated (value list / rebirths / FAQ / sitemap)
            - [ ] Bump `APP_VERSION` in `site/version.js`
            - [ ] Add a `CHANGELOG.md` entry
            - [ ] After merge: redeploy (`git pull && docker compose up -d --build droidex` in the install directory)

  # L'Ecosystem API d'Epic ne garde que 7 jours glissants : on recopie chaque
  # jour les métriques officielles de l'île dans data/metrics/ (histoire
  # complète du jeu, introuvable ailleurs).
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Archive island metrics (Ecosystem API, 7-day window)
        run: python3 tools/archive-metrics.py

      - name: Commit the archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/metrics; then
            git add data/metrics
            git commit -m "bot: archive des métriques de l'île (Ecosystem API)"
            # archive et signals committent sur main en parallèle : un push
            # peut être rejeté si l'autre job vient d'écrire → rebase + retry
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              git push && exit 0
              sleep "$i"
            done
            exit 1
          fi

  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check community and official sources (Discord mirror, wikis, guide)
        id: sig
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PATCH_CHANNEL_ID: ${{ secrets.DISCORD_PATCH_CHANNEL_ID }}
        run: |
          set +e
          python3 tools/watch-signals.py | tee signals.txt
          code=${PIPESTATUS[0]}   # code de python, pas celui de tee
          set -e
          if [ "$code" = "10" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi

      - name: Persist watch state
        # toujours : une source nouvellement configurée (ex. Discord) doit
        # mémoriser son point de départ même quand aucun signal ne part
        run: |
          if git diff --quiet tools/watch-state.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/watch-state.json
          git commit -m "bot: état des signaux communautaires"
          # archive et signals committent sur main en parallèle : un push
          # peut être rejeté si l'autre job vient d'écrire → rebase + retry
          # (course réellement vue le 21/07/2026 : état + issue du jour perdus)
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            git push && exit 0
            sleep "$i"
          done
          exit 1

      - name: Open the signal issue of the day
        if: steps.sig.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # UNE ISSUE PAR JOUR DE SIGNAL, jamais un commentaire sur une issue
          # plus ancienne : le 29/07/2026 on a découvert que les signaux des 25,
          # 26, 27 et 28/07 (dont la sortie du patch v1.23 et un pic de CCU à
          # +234 %) s'étaient empilés en commentaires d'une issue ouverte le
          # 22/07 — aucune notification saillante, patch repéré une semaine plus
          # tard. Une issue datée par jour reste bruyante mais visible.
          DAY=$(date -u +%F)
          TITLE="Signal communautaire du $DAY : patch du jeu possible"
          {
            echo "Des sources ont bougé — le jeu a peut-être été patché."
            echo
            # signals.txt est du markdown déjà assaini par watch-signals.py
            cat signals.txt
            echo
            echo "_Ce signal n'a modifié aucune donnée : la veille tycoon-tools ouvrira sa PR \`bot/gamedata-update\` quand la value list changera. Fermer cette issue une fois le patch identifié (ou écarté)._"
          } > body.md
          # une relance manuelle le même jour complète l'issue du jour
          NUM=$(gh issue list --label gamedata-signal --state open --search "$TITLE in:title" \
                  --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number")
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue comment "$NUM" --body-file body.md
          else
            gh issue create --title "$TITLE" --label gamedata-signal --body-file body.md
          fi
