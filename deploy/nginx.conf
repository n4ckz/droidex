# Journal d'accès persistant (les logs stdout de docker sont perdus à chaque
# recréation du conteneur — vécu : 4 déploiements ont effacé 15 jours
# d'historique le 21/08/2026). Le bruit de monitoring est exclu à la source ;
# les bots restent loggés (suivre les passages de Googlebot est utile).
# Le fichier vit dans le volume ./logs (voir docker-compose.yml), rotation
# côté hôte : deploy/logrotate-droidex.
map $http_user_agent $droidex_loggable {
    default                1;
    ~Uptime-Kuma           0;   # sonde de disponibilité
    ~^Wget                 0;   # healthcheck du conteneur (127.0.0.1)
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminé par Traefik : nginx ne connaît que http. Sans ceci, la
    # redirection d'ajout de slash (/value-list → /value-list/) émet une
    # Location absolue en http:// → chaîne de 2 redirections pour les crawlers.
    # En relatif, le client conserve le schéma https.
    absolute_redirect off;

    # /index.html et /<page>/index.html servent le même contenu que l'URL
    # canonique en / — rediriger pour ne pas exposer de doublons.
    if ($request_uri ~ ^(.*/)index\.html$) {
        return 301 $1;
    }

    # stdout (docker logs) inchangé + copie persistante filtrée
    access_log /var/log/nginx/access.log main;
    access_log /var/log/droidex/access.log main if=$droidex_loggable;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Le service worker et le manifest ne doivent jamais être servis périmés,
    # sinon les mises à jour du site ne sont pas détectées.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Polices et icônes : immuables en pratique, cache long.
    location ~* \.(woff2|png)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Mesure d'audience (Umami) servie en PREMIÈRE PARTIE : le script et
    # l'envoi des vues passent par notre domaine (/u/script.js → /u/api/send,
    # chemin dérivé par le script de son propre src). Les bloqueurs de pub
    # filtrent les domaines umami.* et les script.js tiers, pas un chemin
    # neutre de l'hôte visité. Cible = ${UMAMI_UPSTREAM} (variable substituée
    # au démarrage par l'image nginx, défaut http://umami:3000 dans le
    # Dockerfile), résolue À LA REQUÊTE via le DNS Docker : sans conteneur
    # Umami (compose local, auto-hébergement sans analytics) → 502 discret,
    # nginx démarre quand même. Pas de copie dans le journal persistant :
    # une ligne par vue fausserait les statistiques calculées dessus.
    location /u/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $umami "${UMAMI_UPSTREAM}";
        rewrite ^/u/(.*)$ /$1 break;
        proxy_pass $umami;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        access_log /var/log/nginx/access.log main;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
