# Journal d'accès persistant (les logs stdout de docker sont perdus à chaque
# recréation du conteneur — vécu : 4 déploiements ont effacé 15 jours
# d'historique le 21/08/2026). Le bruit de monitoring est exclu à la source ;
# les bots restent loggés (suivre les passages de Googlebot est utile).
# Le fichier vit dans le volume ./logs (voir docker-compose.yml), rotation
# côté hôte : deploy/logrotate-droidex.
map $http_user_agent $droidex_loggable {
    default                1;
    ~Uptime-Kuma           0;   # sonde de disponibilité
    ~^Wget                 0;   # healthcheck du conteneur (127.0.0.1)
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # stdout (docker logs) inchangé + copie persistante filtrée
    access_log /var/log/nginx/access.log main;
    access_log /var/log/droidex/access.log main if=$droidex_loggable;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Le service worker et le manifest ne doivent jamais être servis périmés,
    # sinon les mises à jour du site ne sont pas détectées.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Polices et icônes : immuables en pratique, cache long.
    location ~* \.(woff2|png)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
